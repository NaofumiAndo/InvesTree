<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>おかねの木 — ポートフォリオの木 プロトタイプ</title>
<style>
  :root {
    --sky-top: #cdeafe;
    --sky-bot: #fde8d4;
    --ground: #e9d3b0;
    --ground-dk: #d8b98a;
    --ink: #5b4a3a;
    --ink-soft: #8a7560;
    --card: #fffaf2;
    --accent: #6fae6a;
    --accent-dk: #4f8a52;
    --shadow: rgba(120, 95, 60, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: #f6efe2;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 18px 60px;
  }
  header.app {
    text-align: center;
    margin-bottom: 14px;
  }
  header.app h1 {
    margin: 4px 0 2px;
    font-size: 26px;
    letter-spacing: 0.06em;
  }
  header.app p { margin: 0; color: var(--ink-soft); font-size: 13px; }

  /* developer-only profile switcher (ページ最下部) */
  .dev-switcher {
    margin-top: 40px;
    padding: 20px;
    border-top: 2px dashed #e0cfb0;
    background: rgba(255, 250, 242, 0.6);
    border-radius: 18px;
    text-align: center;
  }
  .dev-switcher h2 {
    margin: 0 0 4px;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .dev-switcher p {
    margin: 0 0 4px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .dev-sliders {
    text-align: left;
    max-width: 560px;
    margin: 16px auto 0;
  }
  .profiles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 14px 0 4px;
  }
  .profiles button {
    border: 2px solid transparent;
    background: var(--card);
    color: var(--ink);
    border-radius: 16px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
    font-family: inherit;
  }
  .profiles button .emoji { font-size: 16px; margin-right: 4px; }
  .profiles button:hover { transform: translateY(-2px); }
  .profiles button.active {
    border-color: var(--accent);
    background: #eef7ea;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .stage-card {
    background: linear-gradient(180deg, var(--sky-top) 0%, #e7f4e9 62%, var(--sky-bot) 100%);
    border-radius: 24px;
    box-shadow: 0 8px 24px var(--shadow);
    overflow: hidden;
    position: relative;
  }
  .cash-badge {
    position: absolute;
    left: 16px;
    bottom: 36px;
    z-index: 3;
    max-width: 78%;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(3px);
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .cash-badge { cursor: pointer; transition: padding .15s ease; }
  .cash-badge .cb-title { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .cash-badge .cb-caret { margin-left: auto; padding-left: 8px; font-size: 10px; color: var(--ink-soft); transition: transform .15s ease; }
  .cash-badge .cb-body { margin-top: 3px; }
  .cash-badge.collapsed { padding: 6px 12px; }
  .cash-badge.collapsed .cb-body { display: none; }
  .cash-badge.collapsed .cb-caret { transform: rotate(-90deg); }
  .cash-badge.ok    { border-left: 4px solid #6fae6a; }
  .cash-badge.short { border-left: 4px solid #d98a5a; }
  .cash-badge .amt-y { color: var(--accent-dk); font-weight: 700; }
  .cash-badge .amt-s { color: #c2703a; font-weight: 700; }

  .needs .needs-lead { margin: 0 0 8px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .sell-toggle { display: flex !important; align-items: center; gap: 8px; justify-content: flex-start !important; font-size: 13px; color: var(--ink); margin: 4px 0 2px; cursor: pointer; }
  .sell-toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .needs label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin: 10px 0 2px; }
  .needs label span.v { color: var(--ink); font-weight: 700; }
  .needs input[type=range] { width: 100%; accent-color: var(--accent); }
  .needs-result { margin-top: 12px; border-top: 1px dashed #ecdfc8; padding-top: 10px; font-size: 12.5px; }
  .needs-row { display: flex; justify-content: space-between; padding: 2px 0; }
  .needs-row .lab { color: var(--ink-soft); }
  .needs-row .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .needs-bar { height: 12px; border-radius: 7px; background: #eee3cf; overflow: hidden; margin: 8px 0 6px; position: relative; }
  .needs-bar .fill { height: 100%; border-radius: 7px; transition: width .25s ease; }
  .needs-bar .marker { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #8a7560; }
  .needs-verdict { font-weight: 700; margin-top: 4px; }
  .needs-verdict.ok { color: var(--accent-dk); }
  .needs-verdict.short { color: #c2703a; }
  .needs-note { color: var(--ink-soft); font-size: 11.5px; margin-top: 4px; line-height: 1.5; }

  .balance {
    position: absolute;
    top: 16px;
    left: 20px;
    z-index: 3;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(3px);
    border-radius: 16px;
    padding: 8px 14px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .balance .who { font-size: 12px; color: var(--ink-soft); }
  .balance .amt { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
  .balance .delta { font-size: 12px; color: var(--accent-dk); font-weight: 600; }
  .tree-hint {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    z-index: 3;
    pointer-events: none;
  }
  svg.tree { display: block; width: 100%; height: auto; cursor: pointer; }
  .hit { cursor: pointer; }

  /* tooltip bubble */
  .bubble {
    position: absolute;
    z-index: 5;
    max-width: 220px;
    background: #fffdf8;
    border: 2px solid #ead9bd;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink);
    box-shadow: 0 6px 18px var(--shadow);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .15s ease, transform .15s ease;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translateY(0); }
  .bubble b { color: var(--accent-dk); }
  /* クリックで出る投資の内訳 */
  .bubble .bd-head {
    display: flex; justify-content: space-between; gap: 12px;
    font-weight: 700; font-size: 13px;
    padding-bottom: 5px; margin-bottom: 5px;
    border-bottom: 1px solid #ecdfc8;
  }
  .bubble .bd-head .bd-total { color: var(--ink); }
  .bubble .bd-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 2px 0; font-size: 12px;
  }
  .bubble .bd-nm { color: var(--ink-soft); }
  .bubble .bd-amt { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }

  /* side panel */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .box {
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .box h2 {
    margin: 0 0 10px;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    text-transform: none;
  }
  /* 折りたたみ式カード */
  details.box > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    user-select: none;
  }
  details.box > summary::-webkit-details-marker { display: none; }
  details.box > summary::after {
    content: "▾";
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-soft);
    transition: transform .15s ease;
  }
  details.box:not([open]) > summary::after { transform: rotate(-90deg); }
  details.box[open] > summary { margin-bottom: 12px; }
  details.box > summary .tag-custom { margin-left: 0; }
  .holding {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed #ecdfc8;
    font-size: 13px;
  }
  .holding:last-child { border-bottom: none; }
  .holding .nm { display: flex; align-items: center; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .dot.equity { background: #6fae6a; }
  .dot.bond { background: #c79a5b; }
  .dot.other { background: #d98ba8; }
  .holding .amt2 { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .metric { font-size: 12px; }
  .metric .lab { color: var(--ink-soft); }
  .metric .val { font-size: 15px; font-weight: 700; }
  .wind-badge { font-weight: 700; }

  .sliders label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 10px 0 2px;
    display: flex;
    justify-content: space-between;
  }
  .sliders label span.v { color: var(--ink); font-weight: 700; }
  .sliders input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }
  .learnings { font-size: 12.5px; line-height: 1.6; }
  .learnings li { margin-bottom: 6px; }
  .reset-btn {
    margin-top: 10px;
    width: 100%;
    border: none;
    background: #eef7ea;
    color: var(--accent-dk);
    border-radius: 12px;
    padding: 8px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .tag-custom {
    display: inline-block;
    font-size: 11px;
    background: #ffe9c7;
    color: #b3792a;
    border-radius: 8px;
    padding: 2px 8px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>

<body>
<div class="wrap">
  <header class="app">

        <label class="sell-toggle"><input type="checkbox" id="iSell"> 中長期資産を売却して積み立て直す</label>

    </div>
  </div>

  <div class="dev-switcher">
    <h2>🛠 開発者用</h2>
    <p>保有商品・積立期間・年齢がバラバラな5人を切り替えたり、パラメータを直接いじって木の形の変化を確認できます。</p>
    <div class="profiles" id="profiles"></div>

    <details class="box sliders dev-sliders">
      <summary>パラメータを直接調整</summary>
      <label>年齢 <span class="v" id="vAge"></span></label>
      <input type="range" id="sAge" min="20" max="80" step="1">
      <label>積立継続年数 <span class="v" id="vYears"></span></label>
      <input type="range" id="sYears" min="0" max="40" step="0.5">
      <label>株式の分散度（実質銘柄数） <span class="v" id="vDiv"></span></label>
      <input type="range" id="sDiv" min="0" max="3.5" step="0.05">
      <label>株式の量 <span class="v" id="vEq"></span></label>
      <input type="range" id="sEq" min="0" max="100" step="1">
      <label>債券の量 <span class="v" id="vBond"></span></label>
      <input type="range" id="sBond" min="0" max="100" step="1">
      <label>その他資産の量（REIT・金・暗号資産等） <span class="v" id="vOther"></span></label>
      <input type="range" id="sOther" min="0" max="100" step="1">
      <label>現金・MRF等の量（土台） <span class="v" id="vCash"></span></label>
      <input type="range" id="sCash" min="0" max="100" step="1">
      <button class="reset-btn" id="resetBtn">↺ 選んだ人の初期状態に戻す</button>

<script>
/* =========================================================================
   データモデル（最小入力で木が決まる） — §6
   amount は円。distinctSecurities は実質銘柄数（分散の目安）。
   ========================================================================= */
const TODAY = new Date("2026-06-25");

const PROFILES = [
  {
    id: "young",
    emoji: "🌱",
    label: "若者・オルカンのみ",
    name: "ひな（24歳）",

    ],

  },
  {

    age: 68,
    start: "1990-04-01",

      { name: "個別株（1銘柄）", assetClass: "equity", amount: 5000000, distinctSecurities: 1 },
    ],
    cash: 400000,
  },
  {
    id: "growing",
    emoji: "🌳",
    label: "育成中バランス型",
    name: "美咲（38歳）",
    note: "つみたて9年目",
    age: 38,
    start: "2017-04-01",
    holdings: [
      { name: "全世界株式インデックス", assetClass: "equity", amount: 3200000, distinctSecurities: 3000 },
      { name: "個別株（1銘柄）", assetClass: "equity", amount: 800000, distinctSecurities: 1 },
      { name: "先進国債券インデックス", assetClass: "bond", amount: 1500000, distinctSecurities: 800 },
      { name: "J-REIT", assetClass: "other", amount: 300000, distinctSecurities: 50 },
    ],
    cash: 600000,
  },
  {
    id: "ideal",
    emoji: "🌲",
    label: "退職前・理想バランス",
    name: "健司（60歳）",
    note: "つみたて31年・株債50:50",
    age: 60,
    start: "1995-04-01",
    holdings: [
      { name: "全世界株式インデックス", assetClass: "equity", amount: 4800000, distinctSecurities: 3000 },
      { name: "国内株式インデックス", assetClass: "equity", amount: 1200000, distinctSecurities: 400 },
      { name: "先進国債券インデックス", assetClass: "bond", amount: 4000000, distinctSecurities: 1000 },
      { name: "国内債券インデックス", assetClass: "bond", amount: 2000000, distinctSecurities: 300 },
      { name: "純金上場信託", assetClass: "other", amount: 500000, distinctSecurities: 1 },
    ],
    cash: 3000000,
  },
  {
    id: "crypto",
    emoji: "🪙",
    label: "暗号資産偏重・頭でっかち",
    name: "涼太（32歳）",
    note: "つみたて5年・その他が大半",
    age: 32,
    start: "2021-06-01",
    holdings: [
      { name: "ビットコイン", assetClass: "other", amount: 3200000, distinctSecurities: 1 },
      { name: "イーサリアム", assetClass: "other", amount: 800000, distinctSecurities: 1 },
      { name: "個別株（数銘柄）", assetClass: "equity", amount: 1000000, distinctSecurities: 5 },
    ],
    cash: 100000,
  },
];

/* =========================================================================
   モデル → 木のパラメータ（§3, §6 の対応表に基づく派生）
   ========================================================================= */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function yearsFrom(dateStr) {
  return (TODAY - new Date(dateStr)) / (365.25 * 24 * 3600 * 1000);
}

/** 保有商品 → スライダーが操作する生の状態へ */
function profileToState(p) {
  let eq = 0, bd = 0, ot = 0;
  // 株式内の分散スコア：金額加重の log10(実質銘柄数)。1銘柄=0、3000銘柄≈3.48
  let eqWeighted = 0;
  for (const h of p.holdings) {
    if (h.assetClass === "equity") { eq += h.amount; eqWeighted += h.amount * Math.log10(Math.max(1, h.distinctSecurities)); }
    else if (h.assetClass === "bond") bd += h.amount;
    else ot += h.amount;
  }
  const divScore = eq > 0 ? eqWeighted / eq : 0;
  return {
    age: p.age,
    years: Math.max(0, yearsFrom(p.start)),
    divScore: divScore,
    equity: eq,
    bond: bd,
    other: ot,
    cash: p.cash || 0,
  };
}

/** 生の状態 → 描画パラメータ */
function deriveTree(s) {
  const total = s.equity + s.bond + s.other;
  const sb = s.equity + s.bond;
  // 樹高：継続年数で飽和的に成長（芽→若木→大樹）
  const H = 60 + 300 * (1 - Math.exp(-s.years / 11));
  const heightFactor = 0.55 + 0.45 * (H / 360);

  // 株の幹の太さ＝分散度（divScore 0..3.5）。1銘柄=葦のように細い
  const equityGirth = (5 + (clamp(s.divScore, 0, 3.5) / 3.5) * 44) * heightFactor;

  // 債券の幹：量に応じて木質化（分散資産なので素直に太い）
  const bondShareSB = sb > 0 ? s.bond / sb : 0;
  const bondGirth = Math.min(50, 100 * bondShareSB) * heightFactor; // 50:50で株と並ぶ太さ
  const forkRatio = bondShareSB; // 0=1本幹, 0.5=対称

  // 風＝年齢相応リスクとのズレ（§3-3）
  const target = clamp(110 - s.age, 20, 90);
  const equityPctSB = sb > 0 ? (s.equity / sb) * 100 : 0;
  const gap = sb > 0 ? equityPctSB - target : 0;
  // 小さなズレ(±10%程度)は許容しそよ風。それを超えて株が過剰なほど強風に。
  const wind = clamp((gap - 10) / 70, 0, 1);

  // その他＝小枝
  const otherShare = total > 0 ? s.other / total : 0;

  // 根＝現金比率
  const rootDepth = (total + s.cash) > 0 ? s.cash / (total + s.cash) : 0;

  return {
    H, heightFactor, equityGirth, bondGirth, forkRatio,
    wind, gap, target, equityPctSB, otherShare, rootDepth,
    total, equity: s.equity, bond: s.bond, other: s.other,
  };
}

/* =========================================================================
   パラメトリックな木の描画（SVG） — §8 procedural
   ========================================================================= */
const VW = 480, VH = 600, GROUND = 472, CX = 240;

function ribbon(x0, y0, w0, x1, y1, w1, c1x, c1y, c2x, c2y) {
  const wm = (w0 + w1) / 2;
  return `M ${x0 - w0/2} ${y0} `
    + `C ${c1x - wm/2} ${c1y}, ${c2x - w1/2} ${c2y}, ${x1 - w1/2} ${y1} `
    + `L ${x1 + w1/2} ${y1} `
    + `C ${c2x + w1/2} ${c2y}, ${c1x + wm/2} ${c1y}, ${x0 + w0/2} ${y0} Z`;
}

function leafCluster(cx, cy, r, hue) {
  // 重なる楕円で柔らかい水彩風の葉群
  const blobs = [
    [0, 0, 1], [-0.55, 0.1, 0.8], [0.55, 0.12, 0.8],
    [-0.3, -0.5, 0.78], [0.3, -0.52, 0.78], [0, -0.85, 0.62],
    [-0.7, -0.35, 0.55], [0.7, -0.33, 0.55],
  ];
  let s = "";
  for (const [dx, dy, k] of blobs) {
    s += `<ellipse cx="${cx + dx*r}" cy="${cy + dy*r}" rx="${r*k}" ry="${r*k*0.86}" fill="${hue}"/>`;
  }
  return s;
}


function buildTree(t) {
  const wind = t.wind;
  const windLean = wind * 64;          // 風による静的な傾き（先端変位 px）
  const swayAmp = (0.5 + wind * 4.2).toFixed(2); // 揺れ角度
  const swayDur = (4.4 - wind * 2.2).toFixed(2);  // 強風ほど速い

  // 葉の量感（評価額・継続で青々）
  const lush = clamp(t.H / 360, 0.25, 1);
  const greenMain = wind > 0.55 ? "#8fae7a" : "#79b46f"; // 暴風は少しくすむ
  const greenDk = "#5e9a59";

  const f1 = n => n.toFixed(1);
  // 売却モード：木は伐採されて切り株になり、新しい幹は切り株の上から生える
  const sell = (t.sell && t.sell.on) ? t.sell : null;
  const cutH = sell ? clamp(sell.stumpW * 1.7, 46, 108) : 0;  // 切り株の高さ
  const baseY = GROUND - cutH;   // 新しい木が生え始める高さ（=切り口）

  // 再現性のある擬似乱数（同じ条件なら同じ樹形に＝再描画で形がブレない）
  let _seed = 1337;
  const rng = () => { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; };

  // 親より細い、なめらかにテーパー＆少ししなる「枝」1本分のパス
  function branchPath(x0, y0, w0, x1, y1, w1) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;            // 単位法線
    const bend = (rng() - 0.5) * L * 0.10;      // ゆるやかな湾曲
    const bx = (x0 + x1) / 2 + nx * bend, by = (y0 + y1) / 2 + ny * bend;
    const wm = (w0 + w1) / 2;
    return `M ${f1(x0 + nx*w0/2)} ${f1(y0 + ny*w0/2)} ` +
      `Q ${f1(bx + nx*wm/2)} ${f1(by + ny*wm/2)} ${f1(x1 + nx*w1/2)} ${f1(y1 + ny*w1/2)} ` +
      `L ${f1(x1 - nx*w1/2)} ${f1(y1 - ny*w1/2)} ` +
      `Q ${f1(bx - nx*wm/2)} ${f1(by - ny*wm/2)} ${f1(x0 - nx*w0/2)} ${f1(y0 - ny*w0/2)} Z`;
  }

  // 枝先・葉の集計用
  const tips = [];
  const widthDecay = 0.70;     // 子の枝幅 = 親 × 0.70（必ず親より細い）
  const lenDecay   = 0.76;     // 子の枝長 = 親 × 0.76
  const spreadAng  = 0.42;     // 兄弟枝の開き角
  const windPerLv  = -wind * 0.16;  // 1段ごとに風で少しずつ傾く（上ほど大きくしなる）

  // 再帰的な枝分かれ（L-system 的）。一度二股なら先もずっと二股に分かれる。
  // bucket.br に枝、bucket.lf に葉を貯める（株・債券・幹を別グループにして色分け＆内訳表示）
  function grow(x, y, ang, len, w, depth, tint, bucket) {
    const ex = x + Math.cos(ang) * len;
    const ey = y - Math.sin(ang) * len;
    const tipW = Math.max(1.2, w * widthDecay);
    bucket.br += `<path d="${branchPath(x, y, w, ex, ey, tipW)}"/>`;
    if (depth <= 0) {
      tips.push({ x: ex, y: ey });
      const r = 13 + w * 1.8 + lush * 6;
      bucket.lf += leafCluster(ex, ey - r * 0.12, r, tint.main);
      bucket.lf += leafCluster(ex - r * 0.42, ey + r * 0.22, r * 0.6, tint.dk);
      return;
    }
    for (let i = 0; i < 2; i++) {                 // 二股
      const dir = i === 0 ? -1 : 1;
      let a = ang + dir * spreadAng * (0.75 + rng() * 0.5) + windPerLv + (rng() - 0.5) * 0.14;
      const l = len * lenDecay * (0.92 + rng() * 0.16);
      grow(ex, ey, a, l, w * widthDecay, depth - 1, tint, bucket);
    }
    // 太めの枝には中ほどから小枝を1本足してボリュームを出す
    if (w > 7 && depth >= 2 && rng() < 0.55) {
      const a = ang + (rng() - 0.5) * 0.5 + windPerLv;
      grow(ex, ey, a, len * 0.55, tipW * 0.85, depth - 2, tint, bucket);
    }
  }

  const depth = clamp(Math.round(2 + t.H / 90), 2, 5);   // 樹齢が高いほど枝分かれが多い
  const trunkAng = Math.PI / 2 - wind * 0.10;            // 根元のわずかな傾き
  const tintEq = { main: greenMain, dk: greenDk };
  const tintBd = { main: "#5fb4ab", dk: "#4a988e" };   // 債券＝はっきり青緑（ティール）で株と区別
  const baseBucket = { br: "", lf: "" }, eqBucket = { br: "", lf: "" }, bdBucket = { br: "", lf: "" };
  let newTrunkVisW = 0;   // 新しい幹の根元の見かけ幅（切り株との比較用）

  const gs = t.girthScale != null ? t.girthScale : 1;   // 売却後の再成長で幹を細く（追いつくと1.0）

  if (t.forkRatio <= 0.02) {
    /* ----- 1本幹（株式100%）----- */
    t.isFork = false;
    const W = Math.max(3, t.equityGirth * gs);
    newTrunkVisW = W * 1.5;
    const Lf = t.H * 0.30;                                // しっかりした1本の幹
    const fx = CX + Math.cos(trunkAng) * Lf, fy = baseY - Math.sin(trunkAng) * Lf;
    baseBucket.br += `<path d="${branchPath(CX, baseY, W * 1.5, fx, fy, W)}"/>`;  // 末広がりの根元
    grow(fx, fy, trunkAng, t.H * 0.22, W, depth, tintEq, eqBucket);
  } else {
    /* ----- 二股（株 + 債券）：1本の幹から株(左)・債券(右)の2本に分かれる ----- */
    t.isFork = true;
    const ew = Math.max(3, t.equityGirth * gs);   // 株の主枝＝分散度で太さが決まる
    const bw = Math.max(3, t.bondGirth * gs);     // 債券の主枝＝量で太さが決まる
    const trunkW = Math.max((ew + bw) * 0.60, Math.max(ew, bw) * 1.12);  // 幹は主枝より太い
    newTrunkVisW = trunkW * 1.4;
    const Lf = t.H * 0.34;
    const fx = CX + Math.cos(trunkAng) * Lf, fy = baseY - Math.sin(trunkAng) * Lf;
    t.forkY = fy;
    baseBucket.br += `<path d="${branchPath(CX, baseY, trunkW * 1.4, fx, fy, trunkW)}"/>`;
    grow(fx, fy, trunkAng + 0.34, t.H * 0.24, ew, depth, tintEq, eqBucket);  // 株（左）
    grow(fx, fy, trunkAng - 0.30, t.H * 0.24, bw, depth, tintBd, bdBucket);  // 債券（右）
  }

  const strk = `stroke="#6b4f33" stroke-width="0.7" stroke-opacity="0.10" stroke-linejoin="round" stroke-linecap="round"`;

  // 切り株（売却モード）：地面→切り口の太い幹。新しい幹が太るほど切り口を覆い、
  // 追いつくと年輪は隠れて境目が消え、瘤（こぶ）だけが残る。
  let stumpSVG = "";
  if (sell) {
    const sw = sell.stumpW, flare = sw * 1.3, ry = sw * 0.17;
    // 切り株本体
    stumpSVG += `<path d="M ${f1(CX - flare/2)} ${f1(GROUND)} ` +
      `C ${f1(CX - sw*0.52)} ${f1(GROUND - cutH*0.5)}, ${f1(CX - sw/2)} ${f1(baseY + 5)}, ${f1(CX - sw/2)} ${f1(baseY)} ` +
      `L ${f1(CX + sw/2)} ${f1(baseY)} ` +
      `C ${f1(CX + sw/2)} ${f1(baseY + 5)}, ${f1(CX + sw*0.52)} ${f1(GROUND - cutH*0.5)}, ${f1(CX + flare/2)} ${f1(GROUND)} Z" ` +
      `fill="url(#barkE)" ${strk}/>`;
    // 切り口の年輪（新しい幹が上に重なって、太るほど隠れていく）
    stumpSVG += `<ellipse cx="${f1(CX)}" cy="${f1(baseY)}" rx="${f1(sw/2)}" ry="${f1(ry)}" fill="#caa46a"/>`;
    for (let k = 1; k <= 3; k++) {
      const t2 = k / 3.5;
      stumpSVG += `<ellipse cx="${f1(CX)}" cy="${f1(baseY)}" rx="${f1((sw/2)*t2)}" ry="${f1(ry*t2)}" fill="none" stroke="#a8804f" stroke-width="1" opacity="0.7"/>`;
    }
    // 追いついたら瘤（こぶ）を幹に足し、切り口の境目をならす
    if (newTrunkVisW >= sw * 0.92) {
      baseBucket.br += `<ellipse cx="${f1(CX - newTrunkVisW*0.34)}" cy="${f1(baseY + 6)}" rx="${f1(sw*0.15)}" ry="${f1(sw*0.12)}"/>`;
      baseBucket.br += `<ellipse cx="${f1(CX + newTrunkVisW*0.30)}" cy="${f1(baseY + 11)}" rx="${f1(sw*0.11)}" ry="${f1(sw*0.09)}"/>`;
    }
  }

  // 枝は株(緑みの茶)／債券(暖かい茶)でうっすら色分け＆クリックで内訳。
  // 樹冠の葉は左右が混ざるので1グループにまとめ、クリックすると全体の内訳を表示。
  let trunkSVG = "";
  trunkSVG += `<g class="hit" data-part="base" fill="url(#barkE)" ${strk}>${baseBucket.br}</g>`;
  trunkSVG += `<g class="hit" data-part="equity" fill="url(#barkEq)" ${strk}>${eqBucket.br}</g>`;
  if (bdBucket.br) trunkSVG += `<g class="hit" data-part="bond" fill="url(#barkBd)" ${strk}>${bdBucket.br}</g>`;
  const leavesSVG = `<g class="hit" data-part="leaves" stroke="none">${eqBucket.lf}${bdBucket.lf}</g>`;

  // その他資産（REIT・金・暗号資産等）＝木とは別物。足元に置く「鉢植え」で表す。
  // 過大だと鉢が増えて大きくなり、本体の木より目立つ＝偏りの警告に。
  function pottedPlant(x, gy, s, hue) {
    const wTop = 24 * s, wBot = 16 * s, h = 19 * s;
    const rimW = wTop * 1.22, rimH = 5 * s;
    const top = gy - 2, px = x, py = top - rimH;
    let g = "";
    // 葉（鉢のうしろ側）
    const leafCol = [hue, "#5e9a59", "#7cbf86"];
    const stems = 5;
    for (let i = 0; i < stems; i++) {
      const ang = (-Math.PI / 2) + (i - (stems - 1) / 2) * 0.44;
      const len = (15 + 7 * rng()) * s;
      const lx = px + Math.cos(ang) * len, ly = py + Math.sin(ang) * len;
      g += `<path d="M ${f1(px)} ${f1(py)} Q ${f1((px+lx)/2)} ${f1((py+ly)/2 - 4*s)} ${f1(lx)} ${f1(ly)}" stroke="#5e9a59" stroke-width="${f1(1.4*s)}" fill="none" stroke-linecap="round"/>`;
      g += `<ellipse cx="${f1(lx)}" cy="${f1(ly)}" rx="${f1(7*s)}" ry="${f1(4*s)}" fill="${leafCol[i % leafCol.length]}" transform="rotate(${(ang*180/Math.PI+90).toFixed(1)} ${f1(lx)} ${f1(ly)})"/>`;
    }
    // 鉢（テラコッタ）
    g += `<path d="M ${f1(px-wTop/2)} ${f1(top)} L ${f1(px+wTop/2)} ${f1(top)} L ${f1(px+wBot/2)} ${f1(top+h)} L ${f1(px-wBot/2)} ${f1(top+h)} Z" fill="#c98a5f"/>`;
    g += `<path d="M ${f1(px+wTop/2-3.2*s)} ${f1(top)} L ${f1(px+wBot/2-2*s)} ${f1(top+h)} L ${f1(px+wBot/2)} ${f1(top+h)} L ${f1(px+wTop/2)} ${f1(top)} Z" fill="rgba(0,0,0,0.10)"/>`;
    g += `<rect x="${f1(px-rimW/2)}" y="${f1(py)}" width="${f1(rimW)}" height="${f1(rimH+2)}" rx="${f1(2*s)}" fill="#d89a6e"/>`;
    return `<g>${g}</g>`;
  }

  let pots = "";
  if (t.otherShare > 0.001) {
    const n = clamp(Math.ceil(t.otherShare * 8), 1, 5);     // 比率が高いほど鉢が増える
    const baseScale = 0.72 + t.otherShare * 0.95;           // 比率が高いほど鉢が大きい
    const hues = ["#6fae6a", "#7cbf86", "#88b36a"];
    const placed = [];
    for (let i = 0; i < n; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const ring = Math.floor(i / 2);
      const dist = 82 + ring * 50 + (rng() - 0.5) * 12;
      const x = CX + side * dist;
      const s = baseScale * (1 - ring * 0.1) * (0.92 + rng() * 0.16);
      const gy = GROUND + 8 + ring * 5;                     // 手前ほど少し下＝奥行き
      placed.push({ x, gy, s, hue: hues[i % hues.length] });
    }
    // 奥（上）→手前（下）の順に描いて重なりを自然に
    placed.sort((a, b) => a.gy - b.gy);
    for (const pl of placed) pots += pottedPlant(pl.x, pl.gy, pl.s, pl.hue);
  }

  // うっすらラベル：株／債券／その他（どこを押せばよいかの目印・クリックは透過）
  let labels = "";
  const tSty = `text-anchor="middle" font-weight="700" pointer-events="none" paint-order="stroke" stroke="#fdf6e9" stroke-width="3.2" stroke-linejoin="round" style="font-family:inherit"`;
  const lY = GROUND - clamp(t.H * 0.72, 72, 300);
  const lOff = Math.max(66, t.H * 0.30);
  const lfs = clamp(t.H * 0.07, 13, 21).toFixed(0);
  if (t.isFork) {
    labels += `<text x="${f1(CX - lOff)}" y="${f1(lY)}" ${tSty} font-size="${lfs}" fill="#347a3d" opacity="0.62">株</text>`;
    labels += `<text x="${f1(CX + lOff)}" y="${f1(lY)}" ${tSty} font-size="${lfs}" fill="#1f7d70" opacity="0.66">債券</text>`;
  } else {
    labels += `<text x="${f1(CX)}" y="${f1(lY)}" ${tSty} font-size="${lfs}" fill="#347a3d" opacity="0.62">株</text>`;
  }
  if (t.otherShare > 0.001) {
    labels += `<text x="${f1(CX - 88)}" y="${f1(GROUND - 22)}" ${tSty} font-size="13" fill="#a4633a" opacity="0.8">その他</text>`;
  }

  // 根（現金）：必要な土台（生活防衛資金＋目先の出費）を満たすとちょうど健やか。
  // 不足なら浅く頼りなく、超過するほど「根が大きすぎる（遊んでいる現金）」に。
  const cov = t.cashCoverage != null ? t.cashCoverage : 1;
  const rootMag = cov <= 1
    ? cov * 0.9                                  // 0→ほぼ無根、1→健やか
    : Math.min(2.4, 0.9 + (cov - 1) * 0.45);     // 超過するほど肥大
  const rootLen = 16 + rootMag * 98;
  const rootW = 3 + rootMag * 7.5;
  let roots = "";
  const rootAngs = [205, 230, 251, 270, 289, 310, 335];
  for (let i = 0; i < rootAngs.length; i++) {
    // 土台が乏しいうちは本数を絞り、満たす〜超過で太く広く張り出す
    if (cov < 0.45 && (i % 2 === 1)) continue;
    const a = rootAngs[i] * Math.PI / 180;
    const jitter = 0.72 + ((i * 7) % 5) / 11;     // 0.72〜1.08（決定的）
    const len = rootLen * jitter;
    const x1 = CX + Math.cos(a) * len * 1.08;       // 横に広く張る
    const y1 = GROUND - Math.sin(a) * len * 0.58;   // 縦は控えめ（枠内に収める）
    const cx = CX + Math.cos(a) * len * 0.46;
    const cy = GROUND - Math.sin(a) * len * 0.26 + 5;
    const w = rootW * (0.55 + 0.45 * (1 - i / rootAngs.length));
    roots += `<path d="M ${f1(CX)} ${f1(GROUND-2)} Q ${f1(cx)} ${f1(cy)} ${f1(x1)} ${f1(y1)}" stroke="#b98f5e" stroke-width="${f1(w)}" fill="none" stroke-linecap="round" opacity="0.85"/>`;
  }

  // 風のガスト線（強風時）
  let gust = "";
  if (wind > 0.35) {
    const n = Math.round(wind * 5);
    for (let i = 0; i < n; i++) {
      const gy = 120 + i * 60;
      gust += `<path class="gust" d="M 20 ${gy} q 40 -10 90 -4 t 120 -2" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round" style="animation-delay:${i*0.4}s"/>`;
    }
  }

  const svg = `
  <svg class="tree" viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" style="--amp:${swayAmp}deg; --dur:${swayDur}s;">
    <defs>
      <linearGradient id="barkE" gradientUnits="userSpaceOnUse" x1="0" y1="${GROUND}" x2="0" y2="${GROUND - 380}">
        <stop offset="0" stop-color="#8c6238"/><stop offset="0.5" stop-color="#a87a4a"/><stop offset="1" stop-color="#c0986090"/>
      </linearGradient>
      <!-- 株の枝：ほんのり緑みのある茶 -->
      <linearGradient id="barkEq" gradientUnits="userSpaceOnUse" x1="0" y1="${GROUND}" x2="0" y2="${GROUND - 380}">
        <stop offset="0" stop-color="#806a34"/><stop offset="0.5" stop-color="#9c8848"/><stop offset="1" stop-color="#b29a5e90"/>
      </linearGradient>
      <!-- 債券の枝：ほんのり暖かみのある茶 -->
      <linearGradient id="barkBd" gradientUnits="userSpaceOnUse" x1="0" y1="${GROUND}" x2="0" y2="${GROUND - 380}">
        <stop offset="0" stop-color="#9c7240"/><stop offset="0.5" stop-color="#bd9056"/><stop offset="1" stop-color="#d4ad6e90"/>
      </linearGradient>
      <linearGradient id="barkB" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#8c6438"/><stop offset="1" stop-color="#a87b4c"/>
      </linearGradient>
      <linearGradient id="barkBond" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#a9854f"/><stop offset="1" stop-color="#c6a36a"/>
      </linearGradient>
      <!-- 二股用：左(株)→右(債券) を横方向になめらかに変化させ継ぎ目を消す -->
      <linearGradient id="barkFork" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"    stop-color="#8f6238"/>
        <stop offset="0.42" stop-color="#a9794a"/>
        <stop offset="0.58" stop-color="#b58a55"/>
        <stop offset="1"    stop-color="#c8a76c"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.82" cy="0.16" r="0.3">
        <stop offset="0" stop-color="#fff6da"/><stop offset="1" stop-color="#fff6da" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="0" y="0" width="${VW}" height="${VH}" fill="url(#sun)"/>
    <circle cx="394" cy="74" r="34" fill="#ffe9a8" opacity="0.85"/>

    ${gust}

    <!-- 地面 -->
    <path d="M 0 ${GROUND} Q ${CX} ${GROUND-26} ${VW} ${GROUND} L ${VW} ${VH} L 0 ${VH} Z" fill="var(--ground)"/>
    <path d="M 0 ${GROUND} Q ${CX} ${GROUND-26} ${VW} ${GROUND}" stroke="var(--ground-dk)" stroke-width="3" fill="none" opacity="0.5"/>

    <!-- 根 -->
    <g class="hit" data-part="roots">${roots}</g>

    <!-- 木の影 -->
    <ellipse cx="${CX+10}" cy="${GROUND+10}" rx="${90 + t.H*0.1}" ry="14" fill="rgba(90,70,40,0.16)"/>

    <!-- 切り株（売却モードのみ・揺れない） -->
    ${stumpSVG}

    <!-- 揺れるグループ（幹＋葉）。売却時は切り口を支点に揺れる -->
    <g class="sway" style="transform-origin:${CX}px ${baseY}px;">
      ${trunkSVG}
      ${leavesSVG}
    </g>

    <!-- その他資産＝足元の鉢植え（木とは別物・揺れない） -->
    <g class="hit" data-part="other">${pots}</g>

    <!-- うっすらラベル（株／債券／その他） -->
    ${labels}
  </svg>`;
  return svg;
}

/* =========================================================================
   タップ解説（§5）— 状態に応じて文面を動的生成
   ========================================================================= */
// クリックされたパーツの「投資の内訳」を返す（株＝左の枝・債券＝右の枝・鉢＝その他）
function breakdownHTML(part, t) {
  const yen = v => "¥" + Math.round(v).toLocaleString();
  const p = currentProfile();
  const itemsOf = cls => (!custom ? p.holdings.filter(h => h.assetClass === cls) : []);
  const head = (label, total, accent) =>
    `<div class="bd-head" style="color:${accent || 'var(--ink)'}">${label}<span class="bd-total">${yen(total)}</span></div>`;
  const rowsFor = (cls, fallbackLabel, fallbackAmt) => {
    const list = itemsOf(cls);
    if (list.length) return list.map(h =>
      `<div class="bd-row"><span class="bd-nm">${h.name}</span><span class="bd-amt">${yen(h.amount)}</span></div>`).join("");
    return `<div class="bd-row"><span class="bd-nm">${fallbackLabel}</span><span class="bd-amt">${yen(fallbackAmt)}</span></div>`;
  };
  switch (part) {
    case "equity":
      return head("🌳 株式", state.equity, "#4f8a52") + rowsFor("equity", "株式", state.equity);
    case "bond":
      return head("🌿 債券", state.bond, "#a9803b") + rowsFor("bond", "債券", state.bond);
    case "other":
      return head("🪴 その他資産", state.other, "#c2703a") + rowsFor("other", "その他", state.other);
    case "roots": {
      const cash = state.cash, nec = t.necessaryCash || 0, over = t.excessCash || 0;
      let s = head("🌱 現金（土台）", cash, "#5b8f5b");
      s += `<div class="bd-row"><span class="bd-nm">必要な土台</span><span class="bd-amt">${yen(nec)}</span></div>`;
      s += over > 0
        ? `<div class="bd-row"><span class="bd-nm">投資にまわせる余力</span><span class="bd-amt">${yen(over)}</span></div>`
        : `<div class="bd-row"><span class="bd-nm">不足</span><span class="bd-amt">${yen(Math.max(0, nec - cash))}</span></div>`;
      return s;
    }
    default: { // 幹(base)・葉(leaves) ＝ ポートフォリオ全体
      const total = state.equity + state.bond + state.other;
      return head("ポートフォリオ全体", total) +
        `<div class="bd-row"><span class="bd-nm">🌳 株式</span><span class="bd-amt">${yen(state.equity)}</span></div>` +
        `<div class="bd-row"><span class="bd-nm">🌿 債券</span><span class="bd-amt">${yen(state.bond)}</span></div>` +
        `<div class="bd-row"><span class="bd-nm">🪴 その他</span><span class="bd-amt">${yen(state.other)}</span></div>` +
        `<div class="bd-row"><span class="bd-nm">🌱 現金</span><span class="bd-amt">${yen(state.cash)}</span></div>`;
    }
  }
}

function windLabel(wind, gap) {
  if (wind < 0.12) return { txt: "そよ風 🍃", color: "#4f8a52" };
  if (wind < 0.4)  return { txt: "やや強い風 🌬️", color: "#c79a3a" };
  return { txt: "暴風 🌪️", color: "#cf6a4a" };
}

/* =========================================================================
   アプリ状態と描画
   ========================================================================= */
let activeId = PROFILES[0].id;
let state = profileToState(PROFILES[0]);
let custom = false;
let sellMode = false;      // 中長期資産を売却して積み立て直すモード
let restartYears = 0;      // 売却後に再積立してからの年数

// 幹の根元の太さ（切り株の太さの算出に使う）
function trunkWidthOf(td) {
  const ew = Math.max(5, td.equityGirth);
  if (td.forkRatio <= 0.02) return ew;
  const bw = Math.max(5, td.bondGirth);
  return Math.max((ew + bw) * 0.60, Math.max(ew, bw) * 1.12);
}

const $ = id => document.getElementById(id);

function renderProfiles() {
  const host = $("profiles");
  host.innerHTML = "";
  for (const p of PROFILES) {
    const b = document.createElement("button");
    b.className = "profile-btn" + (p.id === activeId ? " active" : "");
    b.innerHTML = `<span class="emoji">${p.emoji}</span>${p.label}`;
    b.onclick = () => { selectProfile(p.id); };
    host.appendChild(b);
  }
}

function selectProfile(id) {
  activeId = id;
  const p = PROFILES.find(x => x.id === id);
  state = profileToState(p);
  custom = false;
  syncSliders();
  renderAll();
}

function currentProfile() { return PROFILES.find(x => x.id === activeId); }

function syncSliders() {
  $("sAge").value = state.age;
  $("sYears").value = state.years.toFixed(1);
  $("sDiv").value = state.divScore.toFixed(2);
  // 量は万円スケールに丸めてスライダーに反映（0-100目盛り）
  $("sEq").value = Math.round(state.equity / 100000);
  $("sBond").value = Math.round(state.bond / 100000);
  $("sOther").value = Math.round(state.other / 100000);
  $("sCash").value = Math.round(state.cash / 100000);
}

function readSliders() {
  state = {
    age: +$("sAge").value,
    years: +$("sYears").value,
    divScore: +$("sDiv").value,
    equity: +$("sEq").value * 100000,
    bond: +$("sBond").value * 100000,
    other: +$("sOther").value * 100000,
    cash: +$("sCash").value * 100000,
  };
  custom = true;
  renderAll();
}

function renderHoldings(t) {
  const p = currentProfile();
  const host = $("holdings");
  if (custom) {
    const rows = [
      ["株式", "equity", state.equity],
      ["債券", "bond", state.bond],
      ["その他資産", "other", state.other],
      ["現金", "other", state.cash],
    ];
    host.innerHTML = rows.map(([nm, cls, amt]) =>
      `<div class="holding"><div class="nm"><span class="dot ${cls}"></span>${nm}</div><div class="amt2">${(amt/10000).toLocaleString()}万円</div></div>`
    ).join("");
    return;
  }
  host.innerHTML = p.holdings.map(h =>
    `<div class="holding"><div class="nm"><span class="dot ${h.assetClass}"></span>${h.name}</div><div class="amt2">${(h.amount/10000).toLocaleString()}万円</div></div>`
  ).join("")
  + `<div class="holding"><div class="nm"><span class="dot other" style="background:#bcbcbc"></span>現金（生活防衛資金）</div><div class="amt2">${(p.cash/10000).toLocaleString()}万円</div></div>`;
}

function renderBalance(t) {
  const p = currentProfile();
  const total = state.equity + state.bond + state.other;
  $("who").textContent = custom ? "カスタム設定" : `${p.name}・${p.note}`;
  $("amt").textContent = "¥" + total.toLocaleString();
  // 擬似的な前日比（葉の色イメージ）
  const delta = (total * 0.0042);
  $("delta").textContent = `前日比 +¥${Math.round(delta).toLocaleString()} (+0.42%)`;
  $("customTag").innerHTML = custom ? `<span class="tag-custom">カスタム編集中</span>` : "";
}

function attachTreeInteractions(t) {
  const bubble = $("bubble");
  const stage = $("stage");
  const svg = stage.querySelector("svg.tree");
  svg.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      let part = el.getAttribute("data-part");
      // 樹冠（葉）はクリックした左右で 株／債券 に振り分ける（左＝株, 右＝債券）
      if (part === "leaves") {
        const rectS = svg.getBoundingClientRect();
        const localX = (e.clientX - rectS.left) / rectS.width * VW;
        part = (t.isFork && localX >= CX) ? "bond" : "equity";
      }
      const html = breakdownHTML(part, t);
      if (!html) return;
      bubble.innerHTML = html;
      // バブルを表示位置へ
      const rect = stage.getBoundingClientRect();
      const px = (e.clientX - rect.left);
      const py = (e.clientY - rect.top);
      let bx = clamp(px + 12, 8, rect.width - 232);
      let by = clamp(py - 10, 8, rect.height - 120);
      bubble.style.left = bx + "px";
      bubble.style.top = by + "px";
      bubble.classList.add("show");
    });
  });
  svg.addEventListener("click", (e) => {
    if (!e.target.closest(".hit")) bubble.classList.remove("show");
  });
}

/* 必要な現金（生活防衛資金＋目先の大型出費）と、余力の算定 */
function computeNeeds() {
  const monthly = (+$("iMonthly").value) * 10000;   // 万円 → 円
  const months  = +$("iMonths").value;
  const nearTerm = (+$("iNear").value) * 10000;
  const emergency = monthly * months;
  const necessary = emergency + nearTerm;
  return { monthly, months, nearTerm, emergency, necessary };
}

const manen = v => Math.round(v / 10000).toLocaleString() + "万円";

function renderNeeds(nd) {
  const cash = state.cash;
  const cov = nd.necessary > 0 ? cash / nd.necessary : 1;
  const over = cash - nd.necessary;
  const fillPct = clamp(cov * 100, 0, 100);
  const fillColor = cov >= 1 ? "#6fae6a" : "#e0a36a";

  $("vMonthly").textContent = (nd.monthly / 10000) + "万/月";
  $("vMonths").textContent = nd.months + "ヶ月分";
  $("vNear").textContent = manen(nd.nearTerm);

  const verdict = cov >= 1
    ? `<div class="needs-verdict ok">✅ 土台クリア｜投資にまわせる余力 ${manen(Math.max(0, over))}</div>
       <div class="needs-note">余力は木を育てる種。つみたて投資にまわせます。</div>`
    : `<div class="needs-verdict short">⚠️ 土台の現金があと ${manen(nd.necessary - cash)} 不足</div>
       <div class="needs-note">まず現金で土台（根）を固めると、暴落にも倒れにくくなります。</div>`;

  $("needsResult").innerHTML =
    `<div class="needs-row"><span class="lab">生活防衛資金（${nd.months}ヶ月）</span><span class="num">${manen(nd.emergency)}</span></div>` +
    `<div class="needs-row"><span class="lab">目先3年の大型出費</span><span class="num">${manen(nd.nearTerm)}</span></div>` +
    `<div class="needs-row"><span class="lab">必要な現金 合計</span><span class="num">${manen(nd.necessary)}</span></div>` +
    `<div class="needs-bar"><div class="fill" style="width:${fillPct}%;background:${fillColor}"></div></div>` +
    `<div class="needs-row"><span class="lab">いまの現金（MRF等含む）</span><span class="num">${manen(cash)}</span></div>` +
    verdict;
}

let cashBadgeCollapsed = true;    // 既定は小さく折りたたみ、タップで展開

function renderCashBadge(nd) {
  const cash = state.cash;
  const cov = nd.necessary > 0 ? cash / nd.necessary : 1;
  const el = $("cashBadge");
  const caret = `<span class="cb-caret">▾</span>`;
  if (cov >= 1) {
    el.className = "cash-badge ok";
    el.innerHTML = `<div class="cb-title">🌱 投資にまわせる余力 <span class="amt-y">${manen(Math.max(0, cash - nd.necessary))}</span>${caret}</div>`
      + `<div class="cb-body">土台（生活防衛＋目先の出費）はクリア。余力で木を育てられます。</div>`;
  } else {
    el.className = "cash-badge short";
    el.innerHTML = `<div class="cb-title">⚠️ 土台の現金が <span class="amt-s">${manen(nd.necessary - cash)}</span> 不足${caret}</div>`
      + `<div class="cb-body">まず生活防衛資金を確保すると、根が安定します。</div>`;
  }
  el.classList.toggle("collapsed", cashBadgeCollapsed);
  el.onclick = () => {
    cashBadgeCollapsed = !cashBadgeCollapsed;
    el.classList.toggle("collapsed", cashBadgeCollapsed);
  };
}

function renderAll() {
  let t;
  if (sellMode) {
    // 売却＝伐採。切り株の太さは「これまで積み立てた木」のサイズ。
    const stumpW = trunkWidthOf(deriveTree(state));
    // 木の本体は再積立年数で育つ（切り株の上から生える）
    t = deriveTree({ ...state, years: restartYears });
    t.sell = { on: true, stumpW };
    // 再成長は最初は細く、元の積立年数に近づくほど切り株の太さに追いつく
    const mat = clamp(restartYears / Math.max(state.years, 0.5), 0, 1);
    t.girthScale = 0.30 + 0.70 * mat;
  } else {
    t = deriveTree(state);
  }
  // 必要現金と余力 → 根のボリュームに反映
  const nd = computeNeeds();
  t.cash = state.cash;
  t.necessaryCash = nd.necessary;
  t.cashCoverage = nd.necessary > 0 ? state.cash / nd.necessary : 1;
  t.excessCash = Math.max(0, state.cash - nd.necessary);

  $("treeHost").innerHTML = buildTree(t);
  $("bubble").classList.remove("show");
  renderBalance(t);
  renderHoldings(t);
  renderNeeds(nd);
  renderCashBadge(nd);
  // slider value labels
  $("vAge").textContent = state.age + "歳";
  $("vYears").textContent = state.years.toFixed(1) + "年";
  $("vDiv").textContent = state.divScore < 0.4 ? "1銘柄級" : state.divScore < 2 ? "数〜数十" : "数千（分散）";
  $("vEq").textContent = (state.equity/10000).toLocaleString() + "万";
  $("vBond").textContent = (state.bond/10000).toLocaleString() + "万";
  $("vOther").textContent = (state.other/10000).toLocaleString() + "万";
  $("vCash").textContent = (state.cash/10000).toLocaleString() + "万";
  $("vRestart").textContent = restartYears.toFixed(1) + "年";
  renderProfiles();
  attachTreeInteractions(t);
}

// スライダー配線
["sAge","sYears","sDiv","sEq","sBond","sOther","sCash"].forEach(id => {
  $(id).addEventListener("input", readSliders);
});
// 現金の土台（必要現金）の入力 → 再描画のみ（保有データは変えない）
["iMonthly","iMonths","iNear"].forEach(id => {
  $(id).addEventListener("input", renderAll);
});
// 売却して積み立て直すモード
$("iSell").addEventListener("change", (e) => {
  sellMode = e.target.checked;
  $("sellControls").style.display = sellMode ? "block" : "none";
  renderAll();
});
$("iRestart").addEventListener("input", (e) => {
  restartYears = +e.target.value;
  renderAll();
});
$("resetBtn").addEventListener("click", () => selectProfile(activeId));

// 起動
syncSliders();
renderAll();
</script>
